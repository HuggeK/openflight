<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830" role="img">
<title>OPS243 UART wiring without sound trigger</title>
<desc>The OPS243 leaves USB and runs from the Raspberry Pi 5 header: 5V on J3 pin 9 to Pi pin 4, ground on J3 pin 10 to Pi pin 6, a crossed UART pair on J3 pins 7 and 6 to Pi pins 10 and 8, and the alert output on J3 pin 1 to Pi pin 12 (GPIO18). The OPS243 is drawn upside down, with its J3 header pins pointing up, pin 1 at the left and ground (pin 10) at the right, and the micro-USB connector on the same edge to the left of J3; the micro-USB stays unplugged. The Raspberry Pi 5 is rotated 90 degrees counter-clockwise so its USB ports face up and the GPIO header runs down its left edge with pin 1 at the bottom.</desc>
