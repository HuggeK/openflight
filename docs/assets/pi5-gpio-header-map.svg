<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img">
<title>Raspberry Pi 5 GPIO header map</title>
<desc>Raspberry Pi 5 40-pin header as mounted in the case, USB ports at the back (top) and pin 1 at the front (bottom), 5V column on the outer edge. OPS243 on physical pins 4, 6, 8, 10 and 12; display power on 2 and 14; LIS3DH on 3, 5, 17 and 20; the Geekworm X1202 UPS pogo pins on 3, 5, 31 and 36. The display ribbon goes in CAM/DISP 1, the upper connector on the right edge, and the camera ribbon in CAM/DISP 0. Below, the OPS243-A J3 header viewed from the front with pin 1 on the left and ground on the right.</desc>
<style>
  .ts { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #5F5E5A; }
  .th { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #3d3d3a; }
</style>
